name: Build Terapia Bowen APK
on:
  push:
    branches: [main]
    paths:
      - 'terapia-bowen-android/**'
      - '.github/workflows/terapia-bowen-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: terapia-bowen-android
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp terapia-bowen-android/app/build/outputs/apk/debug/app-debug.apk Terapia-Bowen-Programari-v1.0.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: terapia-bowen-programari-v102-apk
          path: Terapia-Bowen-Programari-v1.0.2.apk
